<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <title>TEFA Readiness Check — TexasSpecialEd.com</title>
   <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
   <style>
      :root {
         --navy: #0E2340;
         --navy-mid: #1A3A5C;
         --teal: #0D7A6B;
         --teal-light: #E6F5F2;
         --teal-dark: #084F46;
         --amber: #C9630A;
         --amber-light: #FEF3E8;
         --green: #166534;
         --green-light: #DCFCE7;
         --yellow: #854D0E;
         --yellow-light: #FEF9C3;
         --orange: #9A3412;
         --orange-light: #FFF1EB;
         --red: #991B1B;
         --red-light: #FEE2E2;
         --slate: #475569;
         --muted: #64748B;
         --border: #E2E8F0;
         --bg: #FAFAF8;
         --white: #fff;
         --text: #1E293B;
         --serif: 'DM Serif Display', Georgia, serif;
         --sans: 'DM Sans', system-ui, sans-serif;
         --shadow: 0 4px 24px rgba(0, 0, 0, .10);
         --shadow-lg: 0 8px 40px rgba(0, 0, 0, .14);
      }

      *,
      *::before,
      *::after {
         box-sizing: border-box;
         margin: 0;
         padding: 0
      }

      html {
         scroll-behavior: smooth
      }

      body {
         font-family: var(--sans);
         background: var(--bg);
         color: var(--text);
         min-height: 100vh;
         display: flex;
         flex-direction: column;
         align-items: center;
         justify-content: flex-start;
         padding: 32px 16px 64px
      }

      /* ── SHELL ── */
      .bot-shell {
         width: 100%;
         max-width: 580px
      }

      /* ── HEADER ── */
      .bot-header {
         text-align: center;
         margin-bottom: 28px
      }

      .bot-logo {
         font-family: var(--serif);
         font-size: .95rem;
         color: var(--muted);
         margin-bottom: 16px;
         display: block
      }

      .bot-header h1 {
         font-family: var(--serif);
         font-size: 1.9rem;
         color: var(--navy);
         line-height: 1.2;
         margin-bottom: 8px
      }

      .bot-header p {
         font-size: .95rem;
         color: var(--slate);
         max-width: 460px;
         margin: 0 auto
      }

      /* ── PROGRESS ── */
      .progress-wrap {
         margin-bottom: 24px
      }

      .progress-track {
         height: 4px;
         background: var(--border);
         border-radius: 2px;
         overflow: hidden
      }

      .progress-bar {
         height: 4px;
         background: var(--teal);
         border-radius: 2px;
         transition: width .4s ease
      }

      .progress-meta {
         display: flex;
         justify-content: space-between;
         align-items: center;
         margin-top: 8px;
         font-size: .78rem;
         color: var(--muted)
      }

      .progress-meta span:last-child {
         font-weight: 600;
         color: var(--navy)
      }

      /* ── CARD ── */
      .card {
         background: var(--white);
         border-radius: 16px;
         box-shadow: var(--shadow);
         padding: 32px;
         animation: card-in .3s ease;
      }

      @keyframes card-in {
         from {
            opacity: 0;
            transform: translateY(12px)
         }

         to {
            opacity: 1;
            transform: translateY(0)
         }
      }

      /* ── QUESTION ── */
      .q-eyebrow {
         font-size: .72rem;
         font-weight: 700;
         text-transform: uppercase;
         letter-spacing: .08em;
         color: var(--teal);
         margin-bottom: 10px
      }

      .q-text {
         font-family: var(--serif);
         font-size: 1.3rem;
         color: var(--navy);
         line-height: 1.35;
         margin-bottom: 6px
      }

      .q-sub {
         font-size: .85rem;
         color: var(--muted);
         margin-bottom: 22px
      }

      /* ── OPTIONS ── */
      .options {
         display: flex;
         flex-direction: column;
         gap: 10px
      }

      .option {
         display: flex;
         align-items: center;
         gap: 14px;
         padding: 14px 16px;
         border-radius: 10px;
         border: 1.5px solid var(--border);
         background: var(--bg);
         cursor: pointer;
         transition: all .18s;
         text-align: left;
         font-family: var(--sans);
         font-size: .93rem;
         color: var(--text);
      }

      .option:hover {
         border-color: var(--teal);
         background: var(--teal-light);
         color: var(--navy)
      }

      .option.selected {
         border-color: var(--teal);
         background: var(--teal-light);
         color: var(--navy);
         font-weight: 600
      }

      .option__icon {
         width: 36px;
         height: 36px;
         border-radius: 8px;
         background: var(--border);
         display: flex;
         align-items: center;
         justify-content: center;
         font-size: 1.1rem;
         flex-shrink: 0;
         transition: background .18s
      }

      .option:hover .option__icon,
      .option.selected .option__icon {
         background: rgba(13, 122, 107, .15)
      }

      .option__label {
         flex: 1
      }

      .option__sub {
         font-size: .78rem;
         color: var(--muted);
         font-weight: 400;
         display: block;
         margin-top: 2px
      }

      .option:hover .option__sub,
      .option.selected .option__sub {
         color: var(--teal)
      }

      /* ── NAV BUTTONS ── */
      .card-footer {
         display: flex;
         justify-content: space-between;
         align-items: center;
         margin-top: 24px;
         gap: 12px
      }

      .btn {
         display: inline-flex;
         align-items: center;
         gap: 6px;
         font-family: var(--sans);
         font-weight: 600;
         font-size: .9rem;
         padding: 11px 22px;
         border-radius: 8px;
         cursor: pointer;
         border: none;
         transition: all .18s;
         text-decoration: none
      }

      .btn--primary {
         background: var(--teal);
         color: #fff
      }

      .btn--primary:hover {
         background: var(--teal-dark)
      }

      .btn--primary:disabled {
         background: var(--border);
         color: var(--muted);
         cursor: not-allowed
      }

      .btn--ghost {
         background: transparent;
         color: var(--muted);
         border: 1.5px solid var(--border)
      }

      .btn--ghost:hover {
         border-color: var(--slate);
         color: var(--text)
      }

      .btn--amber {
         background: var(--amber);
         color: #fff
      }

      .btn--amber:hover {
         background: #a8520a
      }

      .btn--navy {
         background: var(--navy);
         color: #fff
      }

      .btn--navy:hover {
         background: var(--navy-mid)
      }

      .btn--full {
         width: 100%;
         justify-content: center
      }

      /* ── LANG TOGGLE ── */
      .lang-toggle {
         display: flex;
         gap: 0;
         border: 1.5px solid var(--border);
         border-radius: 8px;
         overflow: hidden;
         margin-bottom: 20px;
         width: fit-content;
         margin-left: auto;
         margin-right: auto
      }

      .lang-btn {
         padding: 7px 18px;
         font-size: .82rem;
         font-weight: 600;
         background: none;
         border: none;
         cursor: pointer;
         color: var(--muted);
         transition: all .18s;
         font-family: var(--sans)
      }

      .lang-btn.active {
         background: var(--navy);
         color: #fff
      }

      /* ── OUTCOME SCREEN ── */
      .outcome-card {
         border-radius: 16px;
         padding: 32px;
         box-shadow: var(--shadow-lg);
         animation: card-in .35s ease
      }

      .outcome-card--green {
         background: var(--green-light);
         border: 2px solid #86EFAC
      }

      .outcome-card--yellow {
         background: var(--yellow-light);
         border: 2px solid #FDE047
      }

      .outcome-card--orange {
         background: var(--orange-light);
         border: 2px solid #FCA572
      }

      .outcome-card--red {
         background: var(--red-light);
         border: 2px solid #FCA5A5
      }

      .outcome-badge {
         display: inline-flex;
         align-items: center;
         gap: 6px;
         font-size: .72rem;
         font-weight: 800;
         text-transform: uppercase;
         letter-spacing: .08em;
         padding: 5px 12px;
         border-radius: 20px;
         margin-bottom: 14px
      }

      .outcome-badge--green {
         background: var(--green);
         color: #fff
      }

      .outcome-badge--yellow {
         background: var(--yellow);
         color: #fff
      }

      .outcome-badge--orange {
         background: var(--orange);
         color: #fff
      }

      .outcome-badge--red {
         background: var(--red);
         color: #fff
      }

      .outcome-title {
         font-family: var(--serif);
         font-size: 1.6rem;
         line-height: 1.2;
         margin-bottom: 10px
      }

      .outcome-title--green {
         color: var(--green)
      }

      .outcome-title--yellow {
         color: var(--yellow)
      }

      .outcome-title--orange {
         color: var(--orange)
      }

      .outcome-title--red {
         color: var(--red)
      }

      .outcome-body {
         font-size: .93rem;
         color: var(--slate);
         margin-bottom: 20px;
         line-height: 1.7
      }

      .next-steps {
         background: rgba(255, 255, 255, .7);
         border-radius: 10px;
         padding: 18px 20px;
         margin-bottom: 20px
      }

      .next-steps__title {
         font-size: .78rem;
         font-weight: 700;
         text-transform: uppercase;
         letter-spacing: .07em;
         color: var(--navy);
         margin-bottom: 10px
      }

      .next-steps__list {
         list-style: none;
         padding: 0
      }

      .next-steps__list li {
         padding: 5px 0 5px 20px;
         position: relative;
         font-size: .88rem;
         color: var(--text)
      }

      .next-steps__list li::before {
         content: '→';
         position: absolute;
         left: 0;
         font-weight: 700;
         color: var(--teal)
      }

      /* ── EMAIL CAPTURE (post-outcome) ── */
      .email-capture {
         background: var(--navy);
         border-radius: 12px;
         padding: 22px;
         margin-top: 20px
      }

      .email-capture__title {
         color: #fff;
         font-weight: 700;
         font-size: .98rem;
         margin-bottom: 4px
      }

      .email-capture__sub {
         color: rgba(255, 255, 255, .6);
         font-size: .82rem;
         margin-bottom: 14px
      }

      .email-row {
         display: flex;
         gap: 8px
      }

      .email-input {
         flex: 1;
         background: rgba(255, 255, 255, .12);
         border: 1px solid rgba(255, 255, 255, .2);
         color: #fff;
         padding: 10px 13px;
         border-radius: 7px;
         font-size: .9rem;
         font-family: var(--sans)
      }

      .email-input:focus {
         outline: none;
         border-color: var(--teal)
      }

      .email-input::placeholder {
         color: rgba(255, 255, 255, .3)
      }

      .email-note {
         font-size: .72rem;
         color: rgba(255, 255, 255, .35);
         margin-top: 8px
      }

      /* ── SCORE METER ── */
      .score-meter {
         display: flex;
         gap: 5px;
         margin-bottom: 16px
      }

      .score-dot {
         width: 12px;
         height: 12px;
         border-radius: 50%;
         background: var(--border);
         transition: background .3s
      }

      .score-dot.active-green {
         background: #22C55E
      }

      .score-dot.active-yellow {
         background: #EAB308
      }

      .score-dot.active-orange {
         background: #F97316
      }

      .score-dot.active-red {
         background: #EF4444
      }

      /* ── INTRO ── */
      .intro-card {
         text-align: center
      }

      .intro-card .feature-list {
         display: flex;
         flex-direction: column;
         gap: 8px;
         margin: 20px 0 24px;
         text-align: left
      }

      .feature-item {
         display: flex;
         align-items: flex-start;
         gap: 10px;
         font-size: .88rem;
         color: var(--slate)
      }

      .feature-item__icon {
         font-size: 1rem;
         flex-shrink: 0;
         margin-top: 1px
      }

      .time-badge {
         display: inline-flex;
         align-items: center;
         gap: 6px;
         background: var(--teal-light);
         color: var(--teal);
         font-size: .78rem;
         font-weight: 600;
         padding: 5px 12px;
         border-radius: 20px;
         margin-bottom: 18px
      }

      /* ── SUBMITTED ── */
      .submitted-card {
         text-align: center;
         padding: 40px 32px
      }

      .submitted-icon {
         font-size: 3rem;
         margin-bottom: 16px;
         display: block
      }

      .submitted-card h2 {
         font-family: var(--serif);
         font-size: 1.6rem;
         color: var(--navy);
         margin-bottom: 10px
      }

      .submitted-card p {
         color: var(--slate);
         font-size: .93rem
      }

      /* ── RESPONSIVE ── */
      @media(max-width:480px) {
         body {
            padding: 20px 12px 48px
         }

         .card {
            padding: 22px
         }

         .outcome-card {
            padding: 22px
         }

         .email-row {
            flex-direction: column
         }

         .bot-header h1 {
            font-size: 1.5rem
         }

         .q-text {
            font-size: 1.15rem
         }
      }
   </style>
</head>

      var state = {
         lang: 'en',
         screen: 'intro', // intro | question | outcome | email-submitted
         step: 0,
         answers: {},
         outcome: null, // green | yellow | orange | red
         email: '',

      /* ════════════════════════════════════════════════
         SCORING LOGIC
        
        Scoring is additive. Each answer awards points
        across three dimensions:
          - iep_ready   (has a compliant IEP on file w/ TEA)
          - evaluation  (district evaluation status)
          - eligibility (disability/residency baseline)

        Final outcome:
          green  = all 3 dimensions strong
          yellow = 2 of 3 strong, or iep close
          orange = eligibility OK but IEP missing
          red    = eligibility issues or TX residency fail
      ════════════════════════════════════════════════ */
      function score(answers) {
         // Hard disqualifiers
         if (answers.state === 'no') return 'red';
         if (answers.diagnosis === 'none' && answers.iep_504 === 'none') return 'red';

         // Build score
         var iepScore = 0;
         var evalScore = 0;
         var eligScore = 0;

         // Eligibility baseline
         if (['yes', 'homeschool', 'private'].includes(answers.state)) eligScore += 2;
         if (['formal', 'suspected', 'school'].includes(answers.diagnosis)) eligScore += 1;
         if (['adhd', 'autism', 'ld', 'other'].includes(answers.disability_type)) eligScore += 1;

         // IEP dimension
         if (answers.iep_504 === 'iep') iepScore += 3;
         else if (answers.iep_504 === 'in_progress') iepScore += 2;
         else if (answers.iep_504 === '504') iepScore += 1;
         // else 0

         if (answers.iep_with_tea === 'yes') iepScore += 3;
         else if (answers.iep_with_tea === 'exists_unsure') iepScore += 1;
         else if (answers.iep_with_tea === 'unsure') iepScore += 1;
         // no = 0

         // Evaluation dimension
         if (answers.evaluation === 'complete') evalScore += 3;
         else if (answers.evaluation === 'in_progress') evalScore += 2;
         else if (answers.evaluation === 'requested') evalScore += 1;
         // none = 0

         // Determine outcome
         if (iepScore >= 5 && evalScore >= 3 && eligScore >= 3) return 'green';
         if (iepScore >= 3 && evalScore >= 2 && eligScore >= 3) return 'yellow';
         if (eligScore >= 3 && iepScore < 3) return 'orange';
         return 'red';
      }

         document.getElementById('bot-title').textContent = COPY[lang].title;

         document.querySelectorAll('.lang-btn').forEach(function(btn, i) {
            btn.classList.toggle('active', (i === 0 && lang === 'en') || (i === 1 && lang === 'es'));
         });
         if (state.screen === 'intro') renderIntro();
      }

      function renderIntro() {
         state.screen = 'intro';
         document.getElementById('progress-wrap').style.display = 'none';
         var C = COPY[state.lang];
         var features = C.features.map(function(f) {
            return '<div class="feature-item"><span class="feature-item__icon">' + f.icon + '</span><span>' + f.text + '</span></div>';
         }).join('');
         document.getElementById('bot-card').innerHTML = '<div class="card intro-card">' +
            '<span class="time-badge">⏱ ' + C.timeNote + '</span>' +
            '<div class="feature-list">' + features + '</div>' +
            '<button class="btn btn--primary btn--full" onclick="startQuiz()" style="font-size:1rem;padding:14px">' + C.start + '</button>' +
            '</div>';
      }

      function startQuiz() {
         state.screen = 'question';
         state.step = 0;
         state.answers = {};
         renderQuestion();
      }

      function renderQuestion() {
         var C = COPY[state.lang];
         var q = C.questions[state.step];
         var tot = C.questions.length;
         var pct = Math.round((state.step / tot) * 100);

         // Progress
         document.getElementById('progress-wrap').style.display = 'block';
         document.getElementById('progress-bar').style.width = pct + '%';
         document.getElementById('progress-label').textContent = C.question + ' ' + (state.step + 1) + ' ' + C.of + ' ' + tot;
         document.getElementById('progress-pct').textContent = pct + '%';

         var selected = state.answers[q.id] || null;

         var opts = q.options.map(function(o) {
            var sel = selected === o.value ? ' selected' : '';
            return '<button class="option' + sel + '" onclick="selectOption(\'' + q.id + '\',\'' + o.value + '\')">' +
               '<span class="option__icon">' + o.icon + '</span>' +
               '<span class="option__label">' + o.label +
               (o.sub ? '<span class="option__sub">' + o.sub + '</span>' : '') +
               '</span></button>';
         }).join('');

         var backBtn = state.step > 0 ?
            '<button class="btn btn--ghost" onclick="goBack()">' + C.back + '</button>' :
            '<span></span>';
         var isLast = state.step === tot - 1;
         var nextDisabled = !selected ? ' disabled' : '';
         var nextLabel = isLast ? C.finish : C.next;
         var nextFn = isLast ? 'finishQuiz()' : 'goNext()';

         document.getElementById('bot-card').innerHTML =
            '<div class="card">' +
            '<div class="q-eyebrow">' + q.eyebrow + '</div>' +
            '<div class="q-text">' + q.text + '</div>' +
            (q.sub ? '<div class="q-sub">' + q.sub + '</div>' : '') +
            '<div class="options">' + opts + '</div>' +
            '<div class="card-footer">' +
            backBtn +
            '<button class="btn btn--primary" onclick="' + nextFn + '"' + nextDisabled + '>' + nextLabel + '</button>' +
            '</div></div>';
      }

      function selectOption(qId, value) {
         state.answers[qId] = value;
         renderQuestion(); // re-render to show selection + enable next
      }

      function goNext() {
         var C = COPY[state.lang];
         var q = C.questions[state.step];
         if (!state.answers[q.id]) return;
         state.step++;
         renderQuestion();
      }

      function goBack() {
         if (state.step > 0) {
            state.step--;
            renderQuestion();
         } else renderIntro();
      }

      function finishQuiz() {
         state.outcome = score(state.answers);
         state.screen = 'outcome';
         document.getElementById('progress-bar').style.width = '100%';
         document.getElementById('progress-label').textContent = '✓ Complete';
         document.getElementById('progress-pct').textContent = '100%';
         renderOutcome();
      }

      function renderOutcome() {
         var C = COPY[state.lang];
         var out = C.outcomes[state.outcome];
         var colorMap = {
            green: 'green',
            yellow: 'yellow',
            orange: 'orange',
            red: 'red'
         };
         var col = colorMap[state.outcome];

         // Score dots
         var dotOrder = ['green', 'yellow', 'orange', 'red'];
         var dotIndex = dotOrder.indexOf(state.outcome);
         var dots = dotOrder.map(function(d, i) {
            var active = i <= dotIndex ? ' active-' + d : '';
            return '<div class="score-dot' + active + '"></div>';
         }).join('');

         var steps = out.steps.map(function(s) {
            return '<li>' + s + '</li>';
         }).join('');

         document.getElementById('bot-card').innerHTML =
            '<div class="outcome-card outcome-card--' + col + '">' +
            '<div class="score-meter">' + dots + '</div>' +
            '<span class="outcome-badge outcome-badge--' + col + '">' + out.badge + '</span>' +
            '<div class="outcome-title outcome-title--' + col + '">' + out.title + '</div>' +
            '<div class="outcome-body">' + out.body + '</div>' +
            '<div class="next-steps">' +
            '<div class="next-steps__title">' + C.nextStepsLabel + '</div>' +
            '<ul class="next-steps__list">' + steps + '</ul>' +
            '</div>' +
            '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px">' +
            '<a href="' + out.cta1Url + '" class="btn btn--navy" style="flex:1;justify-content:center">' + out.cta1Label + '</a>' +
            '<a href="' + out.cta2Url + '" class="btn btn--ghost" style="flex:1;justify-content:center">' + out.cta2Label + '</a>' +
            '</div>' +
            '<div class="email-capture">' +
            '<div class="email-capture__title">' + C.emailTitle + '</div>' +
            '<div class="email-capture__sub">' + C.emailSub + '</div>' +
            '<div class="email-row">' +
            '<input class="email-input" type="email" id="email-field" placeholder="' + C.emailPlaceholder + '" />' +
            '<button class="btn btn--amber" onclick="submitEmail()">' + C.emailBtn + '</button>' +
            '</div>' +
            '<p class="email-note">' + C.emailNote + '</p>' +
            '<button onclick="skipEmail()" style="background:none;border:none;color:rgba(255,255,255,.45);font-size:.78rem;cursor:pointer;margin-top:8px;font-family:var(--sans);text-decoration:underline">' + C.skipEmail + '</button>' +
            '</div>' +
            '</div>';
      }

      function submitEmail() {
         var email = document.getElementById('email-field').value.trim();
         if (!email || !email.includes('@')) {
            document.getElementById('email-field').style.borderColor = '#EF4444';
            return;
         }
         state.email = email;
         // In production: POST to your CRM/email endpoint
         // fetch('/api/subscribe', {method:'POST', headers:{'Content-Type':'application/json'},
         //   body: JSON.stringify({email: email, outcome: state.outcome, lang: state.lang, answers: state.answers})
         // });
         renderSubmitted();
      }

      function skipEmail() {
         renderSubmitted(true);
      }

      function renderSubmitted(skipped) {
         var C = COPY[state.lang];
         document.getElementById('bot-card').innerHTML =
            '<div class="card submitted-card">' +
            (skipped ?
               '<span class="submitted-icon">📚</span>' +
               '<h2>' + C.submittedTitle.replace('Check your inbox!', 'Here are your resources').replace('¡Revisa tu correo!', 'Aquí están tus recursos') + '</h2>' +
               '<p>' + C.submittedBody.replace('Your personalized ESA action plan is on its way. Check your email in the next few minutes.', 'Visit the TEFA hub for all guides, templates, and deadlines.').replace('Tu plan de acción personalizado para TEFA está en camino. Revisa tu bandeja de entrada en los próximos minutos.', 'Visita el centro de TEFA para todas las guías, plantillas y fechas límite.') + '</p>' :
               '<span class="submitted-icon">📬</span>' +
               '<h2>' + C.submittedTitle + '</h2>' +
               '<p>' + C.submittedBody + '</p>'
            ) +
            '<div style="margin-top:24px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">' +
            '<a href="/texas-esa-voucher-disability" class="btn btn--primary">' + C.submittedCta + '</a>' +
            '<button class="btn btn--ghost" onclick="restartQuiz()">Start Over</button>' +
            '</div>' +
            '</div>';
      }

      function restartQuiz() {
         state.step = 0;
         state.answers = {};
         state.outcome = null;
         state.screen = 'intro';
         document.getElementById('progress-wrap').style.display = 'none';
         renderIntro();
      }

      /* ════════════════════════════════════════════════
         INIT
      ════════════════════════════════════════════════ */
      renderIntro();
   </script>
</body>

</html>
